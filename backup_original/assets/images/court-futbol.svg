<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgTurf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#0f3d21"/>
    </linearGradient>
    <radialGradient id="stadiumLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgTurf)"/>
  <!-- Césped cortado a franjas -->
  <path d="M0,0 H100 V500 H0 Z M200,0 H300 V500 H200 Z M400,0 H500 V500 H400 Z M600,0 H700 V500 H600 Z" fill="#ffffff" fill-opacity="0.04"/>
  <rect width="800" height="500" rx="16" fill="url(#stadiumLight)"/>
  
  <!-- Líneas reglamentarias de cancha futsal -->
  <rect x="70" y="50" width="660" height="400" rx="4" fill="none" stroke="#f0fdf4" stroke-width="4" stroke-opacity="0.85"/>
  <line x1="400" y1="50" x2="400" y2="450" stroke="#f0fdf4" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="400" cy="250" r="60" fill="none" stroke="#f0fdf4" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="400" cy="250" r="6" fill="#f0fdf4" stroke-opacity="0.85"/>
  
  <!-- Áreas de penal -->
  <path d="M 70 140 A 110 110 0 0 1 70 360 Z" fill="none" stroke="#f0fdf4" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="160" cy="250" r="5" fill="#f0fdf4"/>
  <path d="M 730 140 A 110 110 0 0 0 730 360 Z" fill="none" stroke="#f0fdf4" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="640" cy="250" r="5" fill="#f0fdf4"/>
  
  <!-- Porterías -->
  <rect x="45" y="195" width="25" height="110" rx="2" fill="#e2e8f0" fill-opacity="0.7" stroke="#ffffff" stroke-width="2"/>
  <rect x="730" y="195" width="25" height="110" rx="2" fill="#e2e8f0" fill-opacity="0.7" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Badge -->
  <g transform="translate(680, 70)">
    <circle cx="0" cy="0" r="26" fill="#22c55e"/>
    <text x="0" y="9" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffffff">⚽</text>
  </g>
</svg>
