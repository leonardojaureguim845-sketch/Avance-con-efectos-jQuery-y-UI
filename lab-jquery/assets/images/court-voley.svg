<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="voleyFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="voleyCourt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Zona libre azul -->
  <rect width="800" height="500" rx="16" fill="url(#voleyFloor)"/>
  <!-- Campo de juego reglamentario naranja 18x9m -->
  <rect x="120" y="70" width="560" height="360" rx="4" fill="url(#voleyCourt)"/>
  <rect x="120" y="70" width="560" height="360" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Línea central y red -->
  <line x1="400" y1="70" x2="400" y2="430" stroke="#ffffff" stroke-width="5"/>
  <rect x="396" y="60" width="8" height="380" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Líneas de ataque (a 3m de la red) -->
  <line x1="300" y1="70" x2="300" y2="430" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,6"/>
  <line x1="500" y1="70" x2="500" y2="430" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,6"/>
  
  <g transform="translate(680, 80)">
    <circle cx="0" cy="0" r="24" fill="#3b82f6"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#ffffff">🏐</text>
  </g>
</svg>
