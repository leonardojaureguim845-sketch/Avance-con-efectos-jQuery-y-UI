<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallyWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Suelo de madera de cancha -->
  <rect width="800" height="500" rx="16" fill="url(#wallyWood)"/>
  <!-- Paredes reglamentarias de Wally lateral y frontal -->
  <polygon points="0,0 800,0 720,70 80,70" fill="url(#wallGradient)" opacity="0.9"/>
  <polygon points="0,0 80,70 80,430 0,500" fill="url(#wallGradient)" opacity="0.8"/>
  <polygon points="800,0 800,500 720,430 720,70" fill="url(#wallGradient)" opacity="0.8"/>
  
  <!-- Superficie interna de juego -->
  <polygon points="80,70 720,70 720,430 80,430" fill="#92400e" opacity="0.6"/>
  <!-- Red de Wally central -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#f8fafc" stroke-width="6" stroke-dasharray="10,6"/>
  <rect x="74" y="240" width="12" height="20" fill="#cbd5e1"/>
  <rect x="714" y="240" width="12" height="20" fill="#cbd5e1"/>
  
  <!-- Balón de Wally -->
  <circle cx="400" cy="210" r="28" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
  <path d="M 380 200 Q 400 210 420 200" stroke="#ca8a04" stroke-width="2" fill="none"/>
  
  <g transform="translate(680, 80)">
    <circle cx="0" cy="0" r="24" fill="#f59e0b"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#ffffff">🏐</text>
  </g>
</svg>
